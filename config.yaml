# Configuração Global - Critical Secret Exposure Detector v4.2

server:
  host: "127.0.0.1"
  port: 8001
  cors_origins: ["*"]

# Integração com GitRepository Intelligence Indexer
indexer:
  enabled: true
  base_url: "http://localhost:8000"
  timeout: 30

privacy:
  store_secret_values: true
  mask_values_in_ui: true
  allow_reveal_in_ui: true

scanner:
  max_threads: 8
  follow_symlinks: false
  max_file_size_mb: 20
  cache_enabled: true
  ignore_directories:
    - "node_modules"
    - ".git"
    - "dist"
    - "build"
    - ".next"
    - "__pycache__"
    - ".venv"
    - "venv"
    - "vendor"
    - "coverage"

ollama:
  enabled: true
  base_url: "http://localhost:11434"
  model: "llama3"
  timeout_seconds: 60
  auto_trigger_on_critical: true

risk_engine:
  min_critical_score: 75
  min_high_score: 45
  min_medium_score: 20
